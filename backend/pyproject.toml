[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-safety-ai"
version = "0.1.0"
description = "Metro Passenger Safety & Crowd Analytics using Edge Computer Vision"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "opencv-python>=4.9.0",
    "ultralytics>=8.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
